<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- Meta viewport cực kỳ quan trọng để vô hiệu hóa zoom trên điện thoại, giúp thao tác bấm mượt như chơi game thật -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Luyện Tập Cấu Hình Electron</title>
    
    <!-- Tải Tailwind CSS để xử lý giao diện -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tải React và Babel để chạy logic App ngay trên trình duyệt -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Tối ưu hóa cho thiết bị cảm ứng di động */
        body { 
            overscroll-behavior-y: contain; /* Ngăn hiệu ứng kéo-để-tải-lại làm gián đoạn game */
            -webkit-tap-highlight-color: transparent; /* Tắt vệt chớp xanh khi chạm trên điện thoại */
        }
        
        /* Chỉnh thanh cuộn cho bảng nguyên tố */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #475569; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #64748b; }

        /* Các hiệu ứng Animation mượt mà */
        @keyframes zoomIn { 
            from { transform: scale(0.5); opacity: 0; } 
            to { transform: scale(1); opacity: 1; } 
        }
        .animate-zoom-in { animation: zoomIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes fadeIn { 
            from { opacity: 0; } 
            to { opacity: 1; } 
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }

        @keyframes spinSlow { 
            100% { transform: rotate(360deg); } 
        }
        .animate-spin-slow { animation: spinSlow 8s linear infinite; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 text-slate-200 font-sans min-h-screen selection:bg-blue-500/30">
    
    <!-- Vùng chứa Game -->
    <div id="root"></div>

    <!-- Logic xử lý bằng React JS -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Các Icon SVG tích hợp sẵn (không cần tải thêm qua mạng) ---
        const AtomIcon = ({className}) => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}>
                <circle cx="12" cy="12" r="3"/>
                <ellipse cx="12" cy="12" rx="10" ry="3.5" transform="rotate(45 12 12)"/>
                <ellipse cx="12" cy="12" rx="10" ry="3.5" transform="rotate(-45 12 12)"/>
                <ellipse cx="12" cy="12" rx="10" ry="3.5" transform="rotate(90 12 12)"/>
            </svg>
        );
        const CheckCircleIcon = ({className}) => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
        );
        const XCircleIcon = ({className}) => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
        );
        const RefreshIcon = ({className}) => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
            </svg>
        );
        const StarIcon = ({className, fill}) => (
            <svg viewBox="0 0 24 24" fill={fill || "none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
        );
        const ArrowRightIcon = ({className}) => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
            </svg>
        );

        // --- Dữ liệu hệ thống ---
        const ELEMENTS = [
            { z: 1, symbol: 'H', name: 'Hydrogen', color: 'bg-red-900/40 border-red-500/50 text-red-300' },
            { z: 2, symbol: 'He', name: 'Helium', color: 'bg-orange-900/40 border-orange-500/50 text-orange-300' },
            { z: 3, symbol: 'Li', name: 'Lithium', color: 'bg-yellow-900/40 border-yellow-500/50 text-yellow-300' },
            { z: 4, symbol: 'Be', name: 'Beryllium', color: 'bg-green-900/40 border-green-500/50 text-green-300' },
            { z: 5, symbol: 'B', name: 'Boron', color: 'bg-teal-900/40 border-teal-500/50 text-teal-300' },
            { z: 6, symbol: 'C', name: 'Carbon', color: 'bg-cyan-900/40 border-cyan-500/50 text-cyan-300' },
            { z: 7, symbol: 'N', name: 'Nitrogen', color: 'bg-blue-900/40 border-blue-500/50 text-blue-300' },
            { z: 8, symbol: 'O', name: 'Oxygen', color: 'bg-indigo-900/40 border-indigo-500/50 text-indigo-300' },
            { z: 9, symbol: 'F', name: 'Fluorine', color: 'bg-purple-900/40 border-purple-500/50 text-purple-300' },
            { z: 10, symbol: 'Ne', name: 'Neon', color: 'bg-pink-900/40 border-pink-500/50 text-pink-300' },
            { z: 11, symbol: 'Na', name: 'Sodium', color: 'bg-rose-900/40 border-rose-500/50 text-rose-300' },
            { z: 12, symbol: 'Mg', name: 'Magnesium', color: 'bg-red-800/40 border-red-400/50 text-red-200' },
            { z: 13, symbol: 'Al', name: 'Aluminum', color: 'bg-orange-800/40 border-orange-400/50 text-orange-200' },
            { z: 14, symbol: 'Si', name: 'Silicon', color: 'bg-yellow-800/40 border-yellow-400/50 text-yellow-200' },
            { z: 15, symbol: 'P', name: 'Phosphorus', color: 'bg-green-800/40 border-green-400/50 text-green-200' },
            { z: 16, symbol: 'S', name: 'Sulfur', color: 'bg-teal-800/40 border-teal-400/50 text-teal-200' },
            { z: 17, symbol: 'Cl', name: 'Chlorine', color: 'bg-cyan-800/40 border-cyan-400/50 text-cyan-200' },
            { z: 18, symbol: 'Ar', name: 'Argon', color: 'bg-blue-800/40 border-blue-400/50 text-blue-200' },
            { z: 19, symbol: 'K', name: 'Potassium', color: 'bg-indigo-800/40 border-indigo-400/50 text-indigo-200' },
            { z: 20, symbol: 'Ca', name: 'Calcium', color: 'bg-purple-800/40 border-purple-400/50 text-purple-200' },
        ];

        const ENERGY_LEVELS = [
            { n: 4, orbitals: [{ id: '4s', label: '4s', max: 2, color: 'bg-emerald-900/60 border border-emerald-400 text-emerald-300 shadow-[0_0_10px_rgba(52,211,153,0.2)]' }] },
            { n: 3, orbitals: [
                { id: '3s', label: '3s', max: 2, color: 'bg-purple-900/60 border border-purple-400 text-purple-300 shadow-[0_0_10px_rgba(192,132,252,0.2)]' },
                { id: '3p', label: '3p', max: 6, color: 'bg-fuchsia-900/60 border border-fuchsia-400 text-fuchsia-300 shadow-[0_0_10px_rgba(232,121,249,0.2)]' }
            ]},
            { n: 2, orbitals: [
                { id: '2s', label: '2s', max: 2, color: 'bg-amber-900/60 border border-amber-400 text-amber-300 shadow-[0_0_10px_rgba(251,191,36,0.2)]' },
                { id: '2p', label: '2p', max: 6, color: 'bg-orange-900/60 border border-orange-400 text-orange-300 shadow-[0_0_10px_rgba(251,146,60,0.2)]' }
            ]},
            { n: 1, orbitals: [
                { id: '1s', label: '1s', max: 2, color: 'bg-rose-900/60 border border-rose-400 text-rose-300 shadow-[0_0_10px_rgba(251,113,133,0.2)]' }
            ]}
        ];

        // --- Ứng dụng Chính ---
        function App() {
            const [selectedZ, setSelectedZ] = useState(20);
            const [config, setConfig] = useState({ '1s': 0, '2s': 0, '2p': 0, '3s': 0, '3p': 0, '4s': 0 });
            const [feedback, setFeedback] = useState(null);

            const activeElement = ELEMENTS.find(e => e.z === selectedZ);
            const totalPlaced = Object.values(config).reduce((sum, val) => sum + val, 0);

            const getCorrectConfig = (z) => {
                let remaining = z;
                const correct = { '1s': 0, '2s': 0, '2p': 0, '3s': 0, '3p': 0, '4s': 0 };
                const order = ['1s', '2s', '2p', '3s', '3p', '4s'];
                for (const sub of order) {
                    if (remaining <= 0) break;
                    let maxCap = sub.includes('p') ? 6 : 2;
                    const fill = Math.min(remaining, maxCap);
                    correct[sub] = fill;
                    remaining -= fill;
                }
                return correct;
            };

            const handleAddElectron = (subshellId, maxCap) => {
                if (feedback === 'success') return;
                setConfig(prev => {
                    const current = prev[subshellId];
                    if (current < maxCap) {
                        setFeedback(null);
                        return { ...prev, [subshellId]: current + 1 };
                    }
                    return prev;
                });
            };

            const handleRemoveElectron = (subshellId) => {
                if (feedback === 'success') return;
                setConfig(prev => {
                    const current = prev[subshellId];
                    if (current > 0) {
                        setFeedback(null);
                        return { ...prev, [subshellId]: current - 1 };
                    }
                    return prev;
                });
            };

            const checkAnswer = () => {
                const correct = getCorrectConfig(selectedZ);
                let isCorrect = true;
                for (const key in correct) {
                    if (config[key] !== correct[key]) {
                        isCorrect = false;
                        break;
                    }
                }
                setFeedback(isCorrect ? 'success' : 'error');
            };

            const resetBoard = () => {
                setConfig({ '1s': 0, '2s': 0, '2p': 0, '3s': 0, '3p': 0, '4s': 0 });
                setFeedback(null);
            };

            const changeElement = (z) => {
                setSelectedZ(z);
                resetBoard();
            };

            const renderSlots = (subshellId, maxCap, currentCount) => {
                const slots = [];
                for (let i = 0; i < maxCap; i++) {
                    const hasElectron = i < currentCount;
                    slots.push(
                        <button
                            key={`${subshellId}-${i}`}
                            onClick={() => hasElectron ? handleRemoveElectron(subshellId) : handleAddElectron(subshellId, maxCap)}
                            className={`relative w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center transition-all duration-300 transform touch-manipulation
                                ${hasElectron 
                                ? 'bg-[radial-gradient(circle_at_35%_35%,#fff_0%,#fde047_20%,#eab308_60%,#a16207_100%)] shadow-[0_4px_10px_rgba(234,179,8,0.5),inset_0_-4px_6px_rgba(0,0,0,0.4),inset_0_2px_4px_rgba(255,255,255,0.8)] border-0 hover:scale-110 active:scale-95 z-10 cursor-pointer' 
                                : 'bg-slate-900/80 border-2 border-slate-800 shadow-[inset_0_4px_8px_rgba(0,0,0,0.8),0_1px_1px_rgba(255,255,255,0.05)] active:bg-slate-700 cursor-pointer'
                                }`}
                            aria-label={hasElectron ? "Lấy electron ra" : "Thêm electron"}
                        >
                            {hasElectron && (
                                <span className="text-yellow-900/70 font-black text-lg md:text-xl pointer-events-none animate-zoom-in drop-shadow-sm select-none">
                                    e⁻
                                </span>
                            )}
                        </button>
                    );
                }
                return slots;
            };

            return (
                <div className="p-2 md:p-8 flex flex-col items-center w-full max-w-7xl mx-auto">
                    {/* Header */}
                    <header className="w-full text-center mb-6 mt-4 relative">
                        <h1 className="text-2xl md:text-5xl font-extrabold text-blue-300 mb-2 drop-shadow-[0_0_15px_rgba(59,130,246,0.4)] flex items-center justify-center gap-2">
                            <AtomIcon className="w-8 h-8 md:w-10 md:h-10 text-yellow-400 animate-spin-slow" />
                            CẤU HÌNH ELECTRON
                        </h1>
                        <p className="text-sm md:text-xl text-slate-400 font-medium">
                            Chạm ô trống để thêm <span className="text-yellow-400 font-bold">e⁻</span>, chạm vào <span className="text-yellow-400 font-bold">e⁻</span> để lấy ra.
                        </p>
                    </header>

                    <div className="w-full flex flex-col lg:flex-row gap-6">
                        {/* Cột trái: Chọn Nguyên tố */}
                        <div className="w-full lg:w-1/3 bg-slate-800/40 backdrop-blur-xl p-4 md:p-5 rounded-3xl shadow-2xl shadow-black/50 border border-slate-700/50 flex flex-col">
                            <div className="bg-blue-600 border border-blue-500 text-white text-center py-2 px-4 rounded-xl font-bold text-sm md:text-lg mb-4 shadow-[0_0_15px_rgba(37,99,235,0.4)]">
                                BẢNG NGUYÊN TỐ (Z=1 đến 20)
                            </div>
                            <div className="grid grid-cols-4 lg:grid-cols-2 gap-2 overflow-y-auto max-h-[30vh] lg:max-h-[60vh] pr-2 custom-scrollbar pb-2">
                                {ELEMENTS.map((el) => (
                                    <button
                                        key={el.z}
                                        onClick={() => changeElement(el.z)}
                                        className={`p-2 md:p-3 rounded-xl font-bold text-xs md:text-base border-2 transition-all duration-200 flex flex-col items-center justify-center active:scale-95
                                            ${selectedZ === el.z 
                                                ? 'bg-blue-600 border-blue-400 text-white shadow-[0_0_15px_rgba(59,130,246,0.5)] transform scale-105' 
                                                : `${el.color} hover:bg-slate-700/80 hover:shadow-lg hover:-translate-y-1`
                                            }`}
                                    >
                                        <span className="text-lg md:text-2xl drop-shadow-sm">{el.symbol}</span>
                                        <span className="opacity-80 font-medium text-[10px] md:text-xs">Z = {el.z}</span>
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* Cột phải: Bảng tương tác */}
                        <div className="w-full lg:w-2/3 bg-slate-800/40 backdrop-blur-xl p-4 md:p-8 rounded-3xl shadow-2xl shadow-black/50 border border-blue-900/30 flex flex-col relative overflow-hidden">
                            
                            {/* Thông tin nguyên tố đang chọn */}
                            <div className="flex flex-col sm:flex-row justify-between items-center mb-6 bg-slate-900/60 p-3 md:p-4 rounded-2xl border border-slate-700/50 shadow-inner">
                                <div className="flex items-center gap-3 md:gap-4 mb-3 sm:mb-0 w-full sm:w-auto">
                                    <div className={`w-14 h-14 md:w-16 md:h-16 rounded-2xl flex items-center justify-center text-2xl md:text-3xl font-black border-2 shadow-[0_0_15px_rgba(255,255,255,0.1)] ${activeElement.color} bg-slate-800`}>
                                        {activeElement.symbol}
                                    </div>
                                    <div>
                                        <h2 className="text-xl md:text-2xl font-bold text-slate-100 drop-shadow-sm">Nguyên tử {activeElement.name}</h2>
                                        <p className="text-sm md:text-lg text-blue-400 font-semibold">Z = {activeElement.z}</p>
                                    </div>
                                </div>

                                <div className="flex w-full sm:w-auto">
                                    <div className="bg-slate-950/80 border border-slate-700 px-3 md:px-4 py-2 w-full justify-center rounded-xl font-bold text-sm md:text-lg flex items-center gap-2 shadow-inner">
                                        Đã điền: <span className={`text-xl md:text-2xl drop-shadow-sm ${totalPlaced === selectedZ ? 'text-green-400' : totalPlaced > selectedZ ? 'text-red-400' : 'text-yellow-400'}`}>{totalPlaced}</span> / {selectedZ} e⁻
                                    </div>
                                </div>
                            </div>

                            {/* Sơ đồ mức năng lượng (Vẽ từ dưới lên) */}
                            <div className="flex-1 flex flex-col justify-end gap-3 md:gap-6 relative p-3 md:p-4 bg-gradient-to-t from-slate-950/80 to-slate-900/40 rounded-2xl border border-slate-700/50 shadow-[inset_0_0_30px_rgba(0,0,0,0.5)] overflow-x-auto custom-scrollbar">
                                
                                <div className="absolute left-1 md:left-4 bottom-8 top-8 w-1 bg-slate-700 rounded-full flex flex-col items-center shadow-inner hidden sm:flex">
                                    <div className="w-0 h-0 border-l-[6px] border-r-[6px] border-b-[10px] border-l-transparent border-r-transparent border-b-slate-600 absolute -top-2"></div>
                                    <span className="absolute -top-6 text-[10px] font-bold text-slate-500 rotate-0">E</span>
                                </div>

                                <div className="pl-1 sm:pl-6 md:pl-10 flex flex-col gap-4 md:gap-6 min-w-max">
                                    {ENERGY_LEVELS.map((level) => (
                                        <div key={level.n} className="flex flex-wrap items-center gap-3 md:gap-8 relative z-10">
                                            {level.orbitals.map((sub) => (
                                                <div key={sub.id} className="flex items-center gap-2 md:gap-4 bg-slate-800/40 p-2 md:p-3 rounded-2xl shadow-lg shadow-black/20 border border-slate-700/50">
                                                    <div className={`${sub.color} w-10 h-10 md:w-12 md:h-12 flex items-center justify-center font-black rounded-xl text-base md:text-lg shrink-0`}>
                                                        {sub.label}
                                                    </div>
                                                    <div className="flex gap-1 md:gap-2">
                                                        {renderSlots(sub.id, sub.max, config[sub.id])}
                                                    </div>
                                                    
                                                    {/* Badge hiển thị */}
                                                    {config[sub.id] > 0 && (
                                                        <div className="flex ml-1 md:ml-2 text-slate-400 font-bold items-center justify-center w-6 md:w-8 text-sm md:text-base">
                                                            {sub.label}<sup>{config[sub.id]}</sup>
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Controls & Feedback */}
                            <div className="mt-6 md:mt-8 flex flex-col sm:flex-row items-center justify-between gap-3 md:gap-4">
                                <button 
                                    onClick={resetBoard}
                                    className="flex w-full sm:w-auto items-center justify-center gap-2 px-6 py-3 md:py-4 rounded-xl md:rounded-full font-bold text-slate-300 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 border border-slate-600 transition-colors shadow-lg"
                                >
                                    <RefreshIcon className="w-5 h-5" />
                                    Làm lại
                                </button>

                                <button 
                                    onClick={checkAnswer}
                                    className={`flex items-center justify-center gap-2 px-8 py-3 md:py-4 rounded-xl md:rounded-full font-extrabold text-white text-lg transition-all transform active:scale-95 shadow-[0_0_20px_rgba(59,130,246,0.4)] w-full sm:w-auto
                                        ${totalPlaced !== selectedZ ? 'bg-slate-700 text-slate-500 shadow-none border border-slate-600' : 'bg-gradient-to-r from-blue-600 to-indigo-600 border border-blue-400/50'}`}
                                    disabled={totalPlaced !== selectedZ}
                                >
                                    KIỂM TRA NGAY
                                </button>
                            </div>

                            {/* Cửa sổ Feedback */}
                            {feedback && (
                                <div className="absolute top-0 left-0 w-full h-full flex items-center justify-center bg-slate-950/90 backdrop-blur-md z-50 animate-fade-in rounded-3xl p-4">
                                    <div className={`p-6 md:p-8 rounded-3xl shadow-[0_0_50px_rgba(0,0,0,0.8)] flex flex-col items-center w-full max-w-sm text-center animate-zoom-in border
                                        ${feedback === 'success' ? 'bg-slate-900 border-green-500/50' : 'bg-slate-900 border-red-500/50'}
                                    `}>
                                        {feedback === 'success' ? (
                                            <>
                                                <div className="relative">
                                                    <StarIcon className="w-16 h-16 md:w-20 md:h-20 text-yellow-400 drop-shadow-[0_0_15px_rgba(250,204,21,0.6)]" fill="currentColor" />
                                                    <CheckCircleIcon className="w-6 h-6 md:w-8 md:h-8 text-green-400 absolute bottom-0 right-0 bg-slate-900 rounded-full" />
                                                </div>
                                                <h3 className="text-2xl md:text-3xl font-black text-green-400 mt-4 mb-2 drop-shadow-[0_0_10px_rgba(74,222,128,0.4)]">Chính xác!</h3>
                                                <p className="text-sm md:text-base text-slate-300 font-medium mb-4 md:mb-6">Cô Thùy khen em nha! Cấu hình của <span className="text-yellow-400 font-bold">{activeElement.symbol}</span> là chuẩn rồi.</p>
                                                
                                                <div className="bg-slate-950 px-3 py-2 md:px-4 md:py-3 rounded-xl border border-green-500/30 shadow-inner mb-4 md:mb-6 w-full text-center">
                                                    <span className="font-bold text-slate-400 text-sm md:text-base">Cấu hình: </span>
                                                    <span className="text-blue-300 font-semibold tracking-wide text-sm md:text-base">
                                                        {['1s', '2s', '2p', '3s', '3p', '4s'].map(s => config[s] > 0 ? <span key={s} className="mx-1">{s}<sup>{config[s]}</sup></span> : null)}
                                                    </span>
                                                </div>

                                                <button 
                                                    onClick={() => {
                                                        if(selectedZ < 20) changeElement(selectedZ + 1);
                                                        else setFeedback(null);
                                                    }}
                                                    className="w-full py-3 md:py-4 bg-gradient-to-r from-green-600 to-emerald-600 active:scale-95 text-white font-bold rounded-xl flex items-center justify-center gap-2 transition-transform shadow-[0_0_15px_rgba(16,185,129,0.4)]"
                                                >
                                                    {selectedZ < 20 ? 'Nguyên tố tiếp theo' : 'Chơi lại'} <ArrowRightIcon className="w-5 h-5"/>
                                                </button>
                                            </>
                                        ) : (
                                            <>
                                                <XCircleIcon className="w-16 h-16 md:w-20 md:h-20 text-red-500 mb-4 drop-shadow-[0_0_15px_rgba(239,68,68,0.6)]" />
                                                <h3 className="text-xl md:text-2xl font-black text-red-400 mb-2 drop-shadow-[0_0_10px_rgba(248,113,113,0.4)]">Chưa chính xác!</h3>
                                                <p className="text-sm md:text-base text-slate-300 font-medium mb-6">Em hãy nhớ quy tắc mức năng lượng (Aufbau) và điền từ thấp lên cao nhé!</p>
                                                <button 
                                                    onClick={() => setFeedback(null)}
                                                    className="w-full py-3 md:py-4 bg-gradient-to-r from-red-600 to-rose-600 active:scale-95 text-white font-bold rounded-xl transition-transform shadow-[0_0_15px_rgba(225,29,72,0.4)]"
                                                >
                                                    Thử lại ngay
                                                </button>
                                            </>
                                        )}
                                    </div>
                                </div>
                            )}

                        </div>
                    </div>
                    
                    <div className="mt-8 text-slate-500 font-medium text-xs md:text-sm flex items-center gap-2 text-center pb-8">
                        Thiết kế dành riêng cho lớp học của Cô Thùy 💛
                    </div>
                </div>
            );
        }

        // Render ứng dụng vào DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
